name: Claude Code Review

# Disabled on pull requests until CLAUDE_CODE_OAUTH_TOKEN is renewed; the expired
# token made this check fail on every PR. To restore, put the pull_request trigger
# back and switch the prompt below to github.event.pull_request.number.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # agent-guidelines (karpathy-guidelines) and coding-standards (typescript-standards)
          # are the skills the repo-local code-review skill invokes. The /code-review skill
          # itself is auto-discovered from this repo's .claude/skills/ on checkout.
          plugin_marketplaces: 'https://github.com/imbenrabi/imbenrabi-claude-marketplace.git'
          plugins: |
            agent-guidelines@imbenrabi
            coding-standards@imbenrabi
          prompt: '/code-review ${{ github.repository }}/pull/${{ inputs.pr_number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

